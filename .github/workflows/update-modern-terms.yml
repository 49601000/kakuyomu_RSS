name: Update Modern Terms RSS

on:
  schedule:
    # 毎日日本時間の09:00（UTC 00:00）に実行
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read work ID
        id: work
        shell: bash
        run: |
          work_id="$(tr -d '[:space:]' < myid-modern-terms.md)"
          if [[ ! "$work_id" =~ ^[0-9]{10,}$ ]]; then
            echo "::notice::新作の作品IDが未設定のためRSS生成をスキップします。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "work_id=$work_id" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.work.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.work.outputs.skip != 'true'
        run: |
          pip install requests

      - name: Generate RSS
        if: steps.work.outputs.skip != 'true'
        run: |
          python kakuyomu_rss.py "${{ steps.work.outputs.work_id }}" -o feed-modern-terms.xml --skip-empty

      - name: Commit and Push
        if: steps.work.outputs.skip != 'true'
        run: |
          if [[ ! -f feed-modern-terms.xml ]]; then
            echo "::notice::公開話が0件のため、既存のRSSは変更しません。"
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add feed-modern-terms.xml
          git commit -m "Auto-update modern terms RSS" || exit 0
          git push
